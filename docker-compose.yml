services:
  mysql:
    image: mysql:8.3
    container_name: mysql
    environment:
      MYSQL_DATABASE: payslipgenerator
      MYSQL_ROOT_PASSWORD: Sujith@142
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: springboot-app
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payslipgenerator
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Sujith@142
    ports:
      - "8080:8080"

volumes:
  mysql_data:
